<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Brasileirão Data</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="./src/views/styles/style.css">
</head>
<body>
  
  <div id="app"></div>

  <!-- Supabase JS SDK via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Renderização da página -->
  <script type="module">
    import { renderMainPage } from './src/views/pages/mainView.js';
    import { MainScript } from './src/views/scripts/mainScript.js';

    document.addEventListener('DOMContentLoaded', () => {
      const app = document.getElementById('app');
      app.innerHTML = renderMainPage();

      const script = new MainScript();
      script.init();
    });
  </script>
</body>
</html>
